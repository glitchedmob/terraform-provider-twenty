# Disposable acceptance only. The helper supplies fresh secrets and a loopback port.
# Startup uses the pinned image's database:init:prod and upgrade entrypoint.
x-twenty-environment: &twenty-environment
  NODE_PORT: "3000"
  SERVER_URL: http://127.0.0.1:${TWENTY_TEST_PORT:?acceptance helper required}
  PG_DATABASE_URL: postgres://twenty:${TWENTY_TEST_DB_PASSWORD:?acceptance helper required}@postgres:5432/twenty
  REDIS_URL: redis://redis:6379
  APP_SECRET: ${TWENTY_TEST_APP_SECRET:?acceptance helper required}
  ENCRYPTION_KEY: ${TWENTY_TEST_ENCRYPTION_KEY:?acceptance helper required}
  STORAGE_TYPE: local
  IS_EMAIL_VERIFICATION_REQUIRED: "true"
  EMAIL_DRIVER: smtp
  EMAIL_FROM_ADDRESS: noreply@acceptance.example
  EMAIL_FROM_NAME: Twenty acceptance
  EMAIL_SMTP_HOST: mail
  EMAIL_SMTP_PORT: "1025"
  EMAIL_SMTP_NO_TLS: "true"
  TELEMETRY_ENABLED: "false"

services:
  postgres:
    image: postgres:16.13-alpine@sha256:4e6e670bb069649261c9c18031f0aded7bb249a5b6664ddec29c013a89310d50
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_TEST_DB_PASSWORD:?acceptance helper required}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "twenty", "-d", "twenty"]
      interval: 2s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7.4.8-alpine@sha256:7aec734b2bb298a1d769fd8729f13b8514a41bf90fcdd1f38ec52267fbaa8ee6
    command: ["redis-server", "--maxmemory-policy", "noeviction", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  mail:
    image: axllent/mailpit:v1.29.4@sha256:0530ab1c658a0f225f148e617522db84053bd1e4879e664c23de5fee44ad6819
    ports:
      - "127.0.0.1::8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  server:
    image: twentycrm/twenty:v2.44.0@sha256:01fb6d2c00397976fd7613dbeb9703b514b52fb6270339b7a326a2a975d15b26
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "false"
      DISABLE_CRON_JOBS_REGISTRATION: "false"
    ports:
      - "127.0.0.1:${TWENTY_TEST_PORT:?acceptance helper required}:3000"
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mail:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/healthz"]
      interval: 3s
      timeout: 5s
      start_period: 120s
      retries: 160

  worker:
    image: twentycrm/twenty:v2.44.0@sha256:01fb6d2c00397976fd7613dbeb9703b514b52fb6270339b7a326a2a975d15b26
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-environment
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - storage:/app/packages/twenty-server/.local-storage
    depends_on:
      server:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 3s
      timeout: 5s
      retries: 30

# Project-scoped volumes are deleted even after a partial startup failure.
volumes:
  database:
  storage:
