# Operation names follow their root field names, as required by the session transport.
fragment ObjectMetadata on Object {
  id
  applicationId
  universalIdentifier
  nameSingular
  namePlural
  labelSingular
  labelPlural
  description
  icon
  isActive
  isSystem
  isRemote
  isLabelSyncedWithName
  writability
  labelIdentifierFieldMetadataId
}

fragment FieldMetadata on Field {
  id
  applicationId
  universalIdentifier
  objectMetadataId
  name
  label
  type
  description
  icon
  isActive
  isSystem
  isLabelSyncedWithName
  isNullable
  writability
}

# @genqlient(for: "CursorPaging.after", omitempty: true)
# @genqlient(for: "CursorPaging.before", omitempty: true)
# @genqlient(for: "CursorPaging.first", omitempty: true)
# @genqlient(for: "CursorPaging.last", omitempty: true)
query Objects(
  $paging: CursorPaging!
) {
  objects(paging: $paging) {
    edges {
      # @genqlient(flatten: true)
      node {
        ...ObjectMetadata
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}

# @genqlient(for: "CursorPaging.after", omitempty: true)
# @genqlient(for: "CursorPaging.before", omitempty: true)
# @genqlient(for: "CursorPaging.first", omitempty: true)
# @genqlient(for: "CursorPaging.last", omitempty: true)
# @genqlient(for: "FieldFilter.and", omitempty: true)
# @genqlient(for: "FieldFilter.id", omitempty: true)
# @genqlient(for: "FieldFilter.isActive", omitempty: true)
# @genqlient(for: "FieldFilter.isSystem", omitempty: true)
# @genqlient(for: "FieldFilter.isUIEditable", omitempty: true)
# @genqlient(for: "FieldFilter.isUIReadOnly", omitempty: true)
# @genqlient(for: "FieldFilter.objectMetadataId", omitempty: true)
# @genqlient(for: "FieldFilter.or", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.eq", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.gt", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.gte", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.iLike", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.in", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.is", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.isNot", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.like", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.lt", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.lte", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.neq", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.notILike", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.notIn", omitempty: true)
# @genqlient(for: "UUIDFilterComparison.notLike", omitempty: true)
query Fields(
  $filter: FieldFilter!
  $paging: CursorPaging!
) {
  fields(filter: $filter, paging: $paging) {
    edges {
      # @genqlient(flatten: true)
      node {
        ...FieldMetadata
      }
    }
    pageInfo { hasNextPage endCursor }
  }
}

# Mutation responses are identifiers only. Always re-read metadata after writes.
